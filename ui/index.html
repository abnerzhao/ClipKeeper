<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src clip:; img-src 'self' data:; object-src 'none'; frame-src 'none'">
<title>拾光</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="workspace">
<aside id="library">
  <div class="side-title"><h2>素材库</h2><span id="total" class="count">0</span></div>
  <div class="imports"><button id="importFiles" class="filled">＋ 导入视频</button><button id="importFolder">导入文件夹</button></div>
  <input id="search" type="search" placeholder="搜索文件夹、文件名或备注" aria-label="搜索素材">
  <div id="items" class="items" aria-label="素材列表"></div>
</aside>
<div id="divider" role="separator" aria-label="素材库宽度" aria-orientation="vertical" aria-controls="library" tabindex="0" title="拖动调整宽度，双击恢复默认"></div>
<div class="detail-pane">
<main>
  <section id="empty" class="empty">
    <img class="film" src="assets/clipkeeper.svg" alt="">
    <h1>留下瞬间美好</h1>
    <p>翻翻拍过的镜头，剪下喜欢的那一段，留给下一个故事。</p>
    <button id="firstImport" class="filled">选择素材文件</button>
  </section>
  <section id="editor" hidden>
    <div class="clip-title"><div class="clip-heading"><h1 id="name"></h1><p id="filePath"></p><div id="metadata" role="group" aria-label="视频规格"></div></div><details id="more" class="more"><summary aria-label="更多素材操作" title="更多素材操作">···</summary><div class="more-menu"><button id="reveal">显示文件</button><button id="remove">移出素材库</button></div></details></div>
    <div class="viewer"><video id="video" crossorigin="anonymous" preload="auto" playsinline></video>
      <div class="viewer-message" id="viewerMessage" hidden><span id="mediaError"></span><button id="makeProxy">生成兼容预览</button></div>
    </div>
    <div class="ruler" id="ruler"><div id="timeline">
      <input id="seek" type="range" min="0" max="1" step="any" value="0" aria-label="播放位置">
      <div id="trimTrack" title="拖出选段，拖动两端调整。按住 Shift 可在已有选区内重新框选。">
        <div id="trimBand"><i class="trim-edge left" data-edge="start" title="拖动入点"></i><i class="trim-edge right" data-edge="end" title="拖动出点"></i></div>
      </div>
    </div>
    </div>
    <div class="transport">
      <button id="play" aria-label="播放或暂停" title="播放 / 暂停（空格）">▶</button>
      <div class="timecode"><span id="position">00:00.000</span><span aria-hidden="true">/</span><span id="duration">00:00.000</span></div>
      <div class="edit-tools">
        <button id="split" aria-label="在此切分" title="在此切分">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="m8.2 8.2 12 12M8.2 15.8 20.2 3.8"/></svg>
        </button>
        <button id="capture" aria-label="保存截图" title="保存截图">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h4l2-3h6l2 3h4a1 1 0 0 1 1 1v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-10a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
        </button>
      </div>
    </div>
    <div id="segments" role="group" aria-label="选择片段" hidden></div>
    <div class="exportbar"><span id="rangeLabel" hidden></span><button id="overwrite">覆盖原片</button><button id="newFile" class="filled">导出为新文件</button></div>
  </section>
</main>
<div id="feedback" class="feedback" hidden>
  <span id="status" role="status"></span>
  <button id="cancel" hidden>取消任务</button>
  <button id="dismiss" hidden aria-label="关闭提示">关闭</button>
</div>
</div>
</div>
<dialog id="noteDialog" aria-labelledby="noteTitle">
  <form method="dialog" class="notebox">
    <h2 id="noteTitle"></h2>
    <label for="note">素材备注（选填）</label>
    <textarea id="note" rows="3" maxlength="4000" placeholder="记录镜头内容或用途" autofocus></textarea>
    <div class="exportbar"><button value="cancel">取消</button><button value="continue" class="filled">继续</button></div>
  </form>
</dialog>
<script src="renderer.js"></script>
</body></html>
